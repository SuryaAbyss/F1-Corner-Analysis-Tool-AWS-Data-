<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Corner Analysis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #e10600;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .col {
            flex: 1;
        }

        button {
            background-color: #e10600;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background-color: #c00500;
        }

        .plot-container {
            margin-top: 30px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>F1 Telemetry Analysis Tool</h1>

        <form method="POST">
            <div class="row">
                <div class="col form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" value="{{ year or 2021 }}" required>
                </div>
                <div class="col form-group">
                    <label for="gp">Grand Prix</label>
                    <input type="text" id="gp" name="gp" value="{{ gp or 'British GP' }}" required>
                </div>
                <div class="col form-group">
                    <label for="session">Session</label>
                    <input type="text" id="session" name="session" value="{{ session or 'Q' }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="driver1">Driver 1</label>
                    <input type="text" id="driver1" name="driver1" value="{{ driver1 or 'HAM' }}" required>
                </div>
                <div class="col form-group">
                    <label for="driver2">Driver 2</label>
                    <input type="text" id="driver2" name="driver2" value="{{ driver2 or 'VER' }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="dist_min">Min Distance (m)</label>
                    <input type="number" id="dist_min" name="dist_min" value="{{ dist_min or 4800 }}" required>
                </div>
                <div class="col form-group">
                    <label for="dist_max">Max Distance (m)</label>
                    <input type="number" id="dist_max" name="dist_max" value="{{ dist_max or 5500 }}" required>
                </div>
            </div>

            <button type="submit">Analyze</button>
        </form>

        {% if error %}
        <div class="error">
            <p>Error: {{ error }}</p>
        </div>
        {% endif %}

        {% if plot_url %}
        <div class="plot-container">
            <h2>Analysis Result</h2>
            <img src="data:image/png;base64,{{ plot_url }}" alt="Corner Analysis Plot">
        </div>
        {% endif %}
    </div>

</body>

</html>
